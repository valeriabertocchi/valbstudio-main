<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendario">
<meta name="theme-color" content="#1c1c1e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}</style>
<title>Calendario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime&family=Dancing+Script:wght@500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600&family=Nunito:wght@400;700&family=Patrick+Hand&family=Playfair+Display:wght@400;700&display=swap">
<style>
/* Layout: come Calendario di Apple su iPad (iPadOS 26) — barra laterale a scheda flottante | barra in alto (+, viste a pillola, ricerca con microfono) e calendario | pannello a scheda a destra. */
:root{
  --bg:#ffffff; --panel:#e4e4e9; --card:#f2f2f7; --group:#ffffff; --chip:#e7e7ec; --seg-on:#ffffff; --line:#dcdce1; --line2:#ececf0;
  --fg:#000000; --muted:#8a8a8e; --red:#ff3b30; --blue:#007aff; --green:#34c759; --orange:#ff9500;
  --tint:.16; --evmix:#000000; --mark:rgba(255,204,0,.32); --shadow:0 10px 30px rgba(0,0,0,.14); --scrim:rgba(0,0,0,.25);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1c1e; --panel:#121214; --card:#2c2c2e; --group:#3a3a3c; --chip:#3a3a3c; --seg-on:#636366; --line:#3a3a3c; --line2:#2a2a2c;
  --fg:#ffffff; --muted:#8e8e93; --red:#ff453a; --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a;
  --tint:.32; --evmix:#ffffff; --mark:rgba(255,214,10,.26); --shadow:0 10px 30px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1c1e; --panel:#121214; --card:#2c2c2e; --group:#3a3a3c; --chip:#3a3a3c; --seg-on:#636366; --line:#3a3a3c; --line2:#2a2a2c;
  --fg:#ffffff; --muted:#8e8e93; --red:#ff453a; --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a;
  --tint:.32; --evmix:#ffffff; --mark:rgba(255,214,10,.26); --shadow:0 10px 30px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sys);font-size:14px;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:280px minmax(0,1fr) auto;gap:10px;padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px))}
#app.collapsed{grid-template-columns:minmax(0,1fr) auto}
#app.collapsed #side{display:none}

/* barra laterale */
#side{background:var(--card);border-radius:22px;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;justify-content:flex-end;gap:4px;padding:0 2px 6px}
.tabs button{width:52px;height:38px;border-radius:19px;display:grid;place-items:center;position:relative;color:var(--fg)}
.tabs button.on{background:var(--fg);color:var(--bg)}
.tabs i{position:absolute;top:2px;right:6px;font-style:normal;font-size:10px;font-weight:700;background:var(--orange);color:#fff;border-radius:8px;padding:0 4px;line-height:15px}
.sbody{display:flex;flex-direction:column;flex:1}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:16px 8px 6px;font-size:15px;color:var(--muted);cursor:pointer;user-select:none}
.sec-h .cnt{font-weight:700;color:var(--orange)}
.crow{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:10px;font-size:15px}
.cbox{width:22px;height:22px;border-radius:50%;border:2px solid rgb(var(--c));box-sizing:border-box;flex:none;display:grid;place-items:center}
.cbox.on{background:rgb(var(--c))}
.cbox.on:after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg);font-size:12px;font-weight:600;font-family:Georgia,serif;display:grid;place-items:center;opacity:.85;flex:none}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 8px;font-size:15px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--chip);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw:before{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked:before{transform:translateX(20px)}
.addrow{display:flex;align-items:center;gap:10px;padding:12px 8px;font-size:15px;text-align:left;border-radius:10px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px;border-radius:10px;font-size:15px;box-sizing:border-box}
.ni.on{background:var(--chip);font-weight:600}
.ni .em{width:20px;text-align:center;flex:none}
.ni .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ib-form input{width:100%;box-sizing:border-box;border:0;background:var(--group);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;margin:2px 0 8px}
.side-tray{background:transparent!important;padding:0!important;gap:5px!important;min-height:60px}
.side-foot{margin-top:auto;padding:18px 8px 4px;font-size:11.5px;color:var(--muted);line-height:1.4;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.side-foot button{color:var(--red);font-size:11.5px;font-weight:600}
.over{outline:2px dashed var(--blue);outline-offset:-2px;background:rgba(10,132,255,.1)!important}

/* barra in alto */
#main{min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative;container-type:inline-size}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 0 4px;flex:none}
.tl{display:flex;gap:8px}
.round{width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center}
.seg{display:flex;background:var(--card);border-radius:22px;padding:4px;gap:2px}
.seg button{padding:7px 14px;border-radius:18px;font-size:15px;white-space:nowrap}
.seg button.on{background:var(--seg-on);font-weight:600}
.back{height:44px;padding:0 16px;border-radius:22px;background:var(--card);font-size:15px}
.vhint{font-size:13.5px;line-height:1.45;color:var(--fg);background:var(--group);border-radius:10px;padding:8px 10px;flex:1}
.searchp{justify-self:end;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:18px;height:36px;padding:0 10px;width:min(180px,100%);transition:width .2s;box-sizing:border-box;color:var(--muted)}
.searchp input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.searchp input::-webkit-search-cancel-button{display:none}
.micb{color:var(--fg);display:grid;place-items:center;width:30px;height:30px;border-radius:15px}
.tr{justify-self:end;display:flex;align-items:center;gap:8px;min-width:0}
.topbar{grid-template-columns:auto 1fr auto}
.topbar>.seg,.topbar>.back{justify-self:center}
@container (max-width:900px){.topbar{grid-template-columns:auto 1fr}.topbar>.tr{justify-self:end}.topbar>.seg,.topbar>.back{grid-column:1/-1;grid-row:2;justify-self:center;max-width:100%;overflow-x:auto}}
.tr .searchp{justify-self:auto}
.claudeb{height:36px;padding:0 14px 0 11px;border-radius:18px;background:#d97757;color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.claudeb .cl{font-size:17px;line-height:1}
.claudeb:hover{filter:brightness(1.08)}
.micb:hover{background:var(--chip)}
.trow2{display:flex;align-items:baseline;gap:10px;padding:14px 4px 10px;flex:none;flex-wrap:wrap}
.trow2 h1{margin:0;font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1.1}
.trow2 h1 b{font-weight:800}
.trow2 .sub{color:var(--muted);font-size:15px}
.trow2 .sp{flex:1}
.navs{color:var(--muted);font-size:22px;width:28px}
.oggi{color:var(--red);font-size:18px}
.sp{flex:1}

/* tendina ricerca */
.dd{position:absolute;right:0;z-index:20;width:min(380px,100%);max-height:65%;overflow-y:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px}
.dd-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:2px 6px 4px}
.ddh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 6px 2px}
.found{display:flex;gap:8px;align-items:baseline;text-align:left;padding:7px 8px;border-radius:9px;font-size:14px}
.found:hover{background:var(--chip)}
.found .dot{width:8px;height:8px;border-radius:50%;background:rgb(var(--c));flex:none;align-self:center}
.found small{color:var(--muted);margin-left:auto;white-space:nowrap}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* elementi trascinabili senza orario */
.tray{border-radius:8px;display:flex;flex-direction:column;gap:3px}
.chip{display:flex;align-items:center;gap:7px;background:var(--chip);border-radius:8px;padding:5px 8px;font-size:13px;box-sizing:border-box;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;min-width:0}
.chip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:500}
.chip .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.done .tt{opacity:.45}
.ck{width:15px;height:15px;border-radius:50%;border:1.8px solid rgb(var(--c));flex:none;display:inline-grid;place-items:center;box-sizing:border-box;cursor:pointer}
.ck.on{background:rgb(var(--c))}
.ck.on:after{content:"";width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:translateY(-1px) rotate(45deg)}
.lk{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:pointer}

/* griglia oraria */
.head,.allday,.body{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr))}
.head{flex:none;padding-bottom:6px}
.dh{text-align:center;font-size:17px;overflow:hidden;color:var(--fg);display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.dh.we{color:var(--muted)}
.dh b{font-weight:400}
.dh.today b{background:var(--red);color:#fff;font-weight:600;border-radius:15px;padding:1px 7px}
.allday{flex:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adl{font-size:12px;color:var(--muted);text-align:right;padding:7px 8px 0 0;line-height:1.15}
.allday .tray{padding:4px 3px;min-height:30px;max-height:112px;overflow-y:auto;border-left:1px solid var(--line);border-radius:0}
.sc{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.gut{position:relative}
.gut span{position:absolute;right:10px;font-size:12px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 40px);cursor:copy}
.ev{position:absolute;box-sizing:border-box;border-radius:6px;padding:3px 5px 3px 11px;background:rgb(var(--c)/var(--tint));font-size:12.5px;line-height:1.25;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;display:flex;flex-direction:column;gap:1px;color:color-mix(in srgb,rgb(var(--c)) 80%,var(--evmix))}
.ev:before{content:"";position:absolute;left:3px;top:3px;bottom:3px;width:3px;border-radius:2px;background:rgb(var(--c))}
.ev .t{font-weight:600;display:flex;gap:5px;align-items:center;min-width:0}
.ev .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tm{font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.ev .tm svg.i{width:11px;height:11px;stroke-width:2}
.ev .lk{color:inherit;opacity:.8}
.ev .ck{width:13px;height:13px}
.ev.short{flex-direction:row;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
.ev.done{opacity:.5}
.ev.new{outline:2px solid rgb(var(--c))}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:2;pointer-events:none}
.now:before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.prev{position:absolute;left:2px;right:2px;border:2px dashed var(--blue);border-radius:6px;background:rgba(10,132,255,.1);pointer-events:none;font-size:11.5px;color:var(--blue);padding:2px 6px;font-weight:700;box-sizing:border-box;z-index:3}
.ghost-drag{position:fixed!important;z-index:100;pointer-events:none;box-shadow:var(--shadow);transform:rotate(-1.5deg);opacity:.97;margin:0!important;right:auto!important;bottom:auto!important;background-color:var(--group)}
.ghost-drag.ev{background-image:linear-gradient(rgb(var(--c)/var(--tint)),rgb(var(--c)/var(--tint)))}
.dragging{opacity:.3}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}

/* mese */
.mwrap{flex:1;display:flex;flex-direction:column;min-height:0;touch-action:pan-y}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none}
.mhead span{font-size:14px;color:var(--muted);text-align:right;padding:4px 8px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0;border-top:1px solid var(--line)}
.mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:copy}
.mcell.oth .mnum{color:var(--muted)}
.mnum{align-self:flex-end;font-size:15px;min-width:26px;height:26px;border-radius:13px;padding:0 6px;box-sizing:border-box}
.mcell.today .mnum{background:var(--red);color:#fff;font-weight:600}
.mev{display:flex;gap:5px;align-items:center;font-size:12px;line-height:1.35;padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;flex:none}
.mev .mt{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.mev .dot{width:7px;height:7px;border-radius:50%;background:rgb(var(--c));flex:none}
.mev .tt{overflow:hidden;text-overflow:ellipsis}
.mev.done{opacity:.45}
.more{font-size:11px;color:var(--muted);text-align:left;padding:0 4px}

/* anno */
.year{flex:1;overflow-y:auto;padding:4px 4px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 26px;align-content:start;touch-action:pan-y}
.ym-t{font-size:17px;font-weight:700;color:var(--red);text-align:left;margin-bottom:6px}
.ym-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.ym-g .w{font-size:10px;color:var(--muted)}
.ym-g button{font-size:12px;height:24px;border-radius:12px;position:relative;font-variant-numeric:tabular-nums}
.ym-g button.today{background:var(--red);color:#fff;font-weight:700}
.ym-g button.dot:after{content:"";position:absolute;left:50%;bottom:1px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--muted)}
.slide-l{animation:sl .22s ease}.slide-r{animation:sr .22s ease}
@keyframes sl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}

/* schede */
.pgrid{padding:4px 2px 24px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;border-radius:16px;padding:12px;min-height:100px;background:var(--card)}
.pcard .em{font-size:20px;line-height:1}
.pcard b{font-size:14px}
.pcard .ex{font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .cnt{margin-top:auto;font-size:11.5px;color:var(--blue)}
.pcard.add{align-items:center;justify-content:center;color:var(--muted)}

.page{overflow-y:auto;flex:1;padding:0 24px 40px;max-width:760px;width:100%;box-sizing:border-box;margin:0 auto;--pf:var(--sys)}
.page.in-panel{padding:0 14px 30px;max-width:none}
.pg-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.in-panel .pg-tools{background:var(--card)}
.pg-tools button,.pg-tools select{font-size:12.5px;padding:4px 10px;border-radius:14px;background:var(--chip);border:0;height:28px}
.pg-tools .accent{background:var(--blue);color:#fff}
.emoji{font-size:34px;line-height:1;margin-top:12px;border-radius:8px;padding:2px}
.emoji-pop{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow);max-width:300px;margin-top:4px}
.emoji-pop button{font-size:20px;padding:4px;border-radius:8px}
.pg-title{display:block;width:100%;border:0;background:transparent;font-family:var(--pf);font-size:28px;font-weight:700;letter-spacing:-.01em;outline:none;margin:6px 0 4px;padding:0}
.pg-cal{display:flex;flex-direction:column;gap:3px;background:var(--card);border-radius:12px;padding:9px 12px;margin:8px 0 12px;position:relative}
.pg-cal:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:rgb(var(--c))}
.pg-cal .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pg-cal .hd button{color:var(--blue);font-size:13px}
.pg-cal .it{display:flex;gap:10px;font-size:13px;text-align:left;padding:1px 0}
.pg-cal .it small{color:var(--muted);min-width:118px;font-variant-numeric:tabular-nums}
.pg-body{outline:none;line-height:1.6;font-size:15.5px;min-height:160px;font-family:var(--pf);-webkit-user-select:text;user-select:text}
.pg-body h3{font-size:17px;margin:16px 0 2px}
.pg-body p{margin:4px 0}
.pg-body ul{margin:2px 0;padding-left:22px}
mark.lnk{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px;border-bottom:1.5px solid var(--orange);cursor:pointer}
mark.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px rgba(255,149,0,.45)}100%{box-shadow:0 0 0 0 transparent}}
.backl{margin-top:24px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.backl h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bl{display:flex;gap:7px;align-items:center;text-align:left;font-size:13.5px;padding:3px 4px;border-radius:6px;max-width:100%}
.bl .dot{width:8px;height:8px;border-radius:50%;background:rgb(var(--c));flex:none}
.bl small{color:var(--muted)}
.danger{color:var(--red);font-size:12.5px;margin-top:20px}

/* pannello a destra */
#panel{position:fixed;top:10px;right:10px;bottom:10px;width:min(350px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow-y:auto;display:flex;flex-direction:column;min-height:0;box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:60;animation:pin .18s ease}
@keyframes pin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;position:sticky;top:0;background:var(--panel);z-index:3;gap:8px;font-size:15px}
.panel-h button{color:var(--blue);font-size:15px}
.panel-h .del{color:var(--red)}
.form{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.f-title{font-size:19px;font-weight:600;border:0;background:var(--group);border-radius:12px;outline:none;width:100%;padding:10px 12px;box-sizing:border-box}
.fg{background:var(--group);border-radius:12px;overflow:hidden}
.fr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line);gap:8px;min-height:28px;font-size:14px}
.fr:first-child{border-top:0}
.fr input[type=date],.fr input[type=time],.fr select{background:var(--chip);border:0;border-radius:8px;padding:5px 8px;font-size:14px;max-width:180px}
.fr .mini-b{font-size:13px;color:var(--blue)}
.fr .sw{width:46px;height:28px}
.fr .sw:before{width:24px;height:24px}
.fr .sw:checked:before{transform:translateX(18px)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:20px;height:20px;border-radius:50%;background:rgb(var(--c))}
.colors button.on{box-shadow:0 0 0 2px var(--group),0 0 0 4px var(--fg)}
#f-q{width:100%;border:0;background:var(--chip);border-radius:9px;padding:7px 10px;outline:none;font-size:14px}
#f-res{display:flex;flex-direction:column;padding:0 6px 6px}
.res{display:flex;flex-direction:column;text-align:left;padding:6px 8px;border-radius:8px;font-size:14px}
.res:hover{background:var(--chip)}
.res small{font-size:12px;color:var(--muted)}
.lkbig{text-align:left;font-size:14px;color:var(--blue)}
textarea{width:100%;box-sizing:border-box;border:0;background:transparent;resize:vertical;min-height:70px;outline:none;font-size:14px}

/* dettatura */
#voice{position:fixed;inset:0;background:var(--scrim);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:calc(70px + env(safe-area-inset-top,0px)) 16px 16px}
.vbox{width:min(540px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow-y:auto}
.vbox h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.vbox h3 button{color:var(--blue);font-size:15px;font-weight:400}
#v-text{border:0;border-radius:12px;padding:11px 12px;min-height:96px;font-size:15px;background:var(--group)}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vbtn{height:36px;padding:0 16px;border-radius:18px;background:var(--chip);font-size:15px;font-weight:600}
.vbtn.pri{background:var(--blue);color:#fff}
.vmic.live{background:var(--red);color:#fff}
.vex{font-size:12.5px;color:var(--muted);line-height:1.5}
#v-out{display:flex;flex-direction:column;gap:5px;font-size:14px}
#v-out .it{padding:8px 10px;border-radius:10px;background:var(--group)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:18px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:1100px){
  #panel{position:fixed;top:10px;right:10px;bottom:10px;width:min(350px,calc(100% - 20px));box-shadow:var(--shadow);z-index:50}
}
@media (max-width:900px){
  #app{grid-template-columns:250px minmax(0,1fr) auto}
  .seg button{padding:6px 10px;font-size:14px}
  .searchp{width:min(200px,100%)}
}
@media (max-width:700px){
  #app,#app.collapsed{grid-template-columns:minmax(0,1fr) auto}
  #side{position:fixed;top:10px;left:10px;bottom:10px;width:min(280px,calc(100% - 20px));z-index:60;box-shadow:var(--shadow)}
  .topbar{grid-template-columns:auto 1fr;}
  .topbar .seg{grid-column:1/-1;grid-row:2;justify-self:center;overflow-x:auto;max-width:100%}
  .trow2 h1{font-size:26px}
}
/* mese continuo, stile iPad */
.mwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none;border-bottom:1px solid var(--line)}
.mhead span{font-size:14px;color:var(--muted);text-align:right;padding:4px 8px}
.mscroll{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;--wh:116px}
.mweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:var(--wh)}
.mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;cursor:copy}
.mcell.we{background:color-mix(in srgb,var(--card) 35%,transparent)}
.mnum{align-self:flex-end;font-size:15px;min-width:26px;height:26px;border-radius:13px;padding:0 6px;box-sizing:border-box;white-space:nowrap}
.mnum b{font-weight:700}
.mcell.today .mnum{background:var(--red);color:#fff;font-weight:600}
.mev{display:flex;gap:6px;align-items:center;font-size:12.5px;line-height:1.4;padding:0 5px;border-radius:5px;white-space:nowrap;overflow:hidden;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;flex:none}
.mev .dot{width:7px;height:7px;border-radius:50%;background:rgb(var(--c));flex:none}
.mev .tt{overflow:hidden;text-overflow:ellipsis}
.mev.all{background:rgb(var(--c)/var(--tint));color:color-mix(in srgb,rgb(var(--c)) 80%,var(--evmix));font-weight:600}
.mev.done{opacity:.45}
.more{font-size:11.5px;color:var(--muted);text-align:left;padding:0 5px}

/* finestra al passaggio del mouse o della Pencil */
#tip{position:fixed;z-index:120;width:270px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:5px;pointer-events:none;font-size:13px;border:1px solid var(--line)}
.tp-t{font-size:15px;font-weight:700;padding-left:10px;position:relative;line-height:1.3}
.tp-t:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:rgb(var(--c))}
.tp-r{display:flex;gap:7px;align-items:center;color:var(--fg)}
.tp-r .k{color:var(--muted);min-width:66px}
.tp-r .dot{width:8px;height:8px;border-radius:50%;background:rgb(var(--c));flex:none}
.tp-n{color:var(--muted);border-top:1px solid var(--line);padding-top:6px;white-space:pre-wrap}

/* nuovo calendario: colori come su iPad */
.fg-h{font-size:13px;color:var(--muted);padding:0 4px;margin-bottom:-6px}
.clrs{display:flex;flex-direction:column}
.clr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;text-align:left;position:relative;cursor:pointer}
.clr:first-child{border-top:0}
.clr .dot{width:14px;height:14px;border-radius:50%;background:rgb(var(--c));flex:none}
.clr .chk{margin-left:auto;color:var(--blue);font-weight:700}
.clr input[type=color]{margin-left:auto;width:34px;height:26px;border:0;padding:0;background:none;cursor:pointer}

/* schede in stile Pages */
.pg-tools{gap:6px}
.pg-tools select{padding:4px 8px}
.tgrp{display:inline-flex;background:var(--chip);border-radius:14px;overflow:visible;position:relative}
.tgrp button{background:transparent!important;min-width:30px;padding:4px 8px!important;font-size:13px!important}
.tgrp button+button{border-left:1px solid var(--line)}
.tpop{position:absolute;top:34px;right:0;z-index:5;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px;border:1px solid var(--line)}
.tgrp .hl{width:26px;height:26px;border-radius:50%;background:rgb(var(--c)/.6)!important;padding:0!important;min-width:0!important;border:0!important}
.tgrp .hl.none{background:var(--chip)!important;font-size:11px!important}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pcol{display:flex;gap:6px;align-items:center;padding-bottom:4px}
.pcol span{font-size:12px;color:var(--muted);margin-right:2px}
.pcol button{width:16px;height:16px;border-radius:50%;background:rgb(var(--c))}
.pcol button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.pg-body h2{font-size:21px;margin:18px 0 4px}
.pg-body h3{font-size:17px;margin:14px 0 2px;color:var(--muted)}
.pg-body blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid rgb(var(--pc));color:var(--muted)}
.pg-body ol{margin:2px 0;padding-left:24px}
.pg-body ul.dash{list-style:none;padding-left:20px}
.pg-body ul.dash>li{position:relative}
.pg-body ul.dash>li:before{content:"–";position:absolute;left:-16px;color:var(--muted)}
.pg-body ul.check{list-style:none;padding-left:2px}
.pg-body ul.check>li{position:relative;padding-left:28px;margin:3px 0}
.pg-body ul.check>li:before{content:"";position:absolute;left:0;top:.25em;width:17px;height:17px;border-radius:50%;border:1.6px solid var(--muted);box-sizing:border-box;cursor:pointer}
.pg-body ul.check>li.done{color:var(--muted);text-decoration:line-through}
.pg-body ul.check>li.done:before{background:rgb(var(--pc));border-color:rgb(var(--pc))}
.pg-body img{max-width:100%;height:auto;border-radius:12px;display:block;margin:8px 0}
.pg-body img.drawing{background:#fff;border:1px solid var(--line);cursor:pointer}
mark.lnk{background:rgb(var(--pc)/.35);border-bottom:2px solid rgb(var(--pc))}
details.backl{margin-top:26px;border-top:1px solid var(--line);padding-top:10px;display:block}
details.backl summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;padding:4px 0}
details.backl summary::-webkit-details-marker{display:none}
details.backl summary:before{content:"›";display:inline-block;transition:transform .15s;color:var(--muted);font-size:18px;line-height:1}
details.backl[open] summary:before{transform:rotate(90deg)}
details.backl summary span{color:var(--muted);font-weight:400}
.bl-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 4px 2px}
.bl-h button{color:var(--blue);font-size:12.5px}

/* disegno con la Pencil */
#draw{position:fixed;inset:0;background:var(--scrim);z-index:160;display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{width:min(1000px,100%);background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.dtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtools button{height:32px;padding:0 12px;border-radius:16px;background:var(--chip);font-size:14px}
.dtools .pri{background:var(--blue);color:#fff;font-weight:600}
.dtools .on{box-shadow:0 0 0 2px var(--blue)}
.dtools .ink{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--card)}
.dtools .dsz{width:32px;padding:0;display:grid;place-items:center}
.dtools .dsz i{display:block;border-radius:50%;background:var(--fg)}
.dsep{width:1px;height:22px;background:var(--line)}
#dcv{width:100%;height:auto;aspect-ratio:1000/650;background:#fff;border-radius:14px;touch-action:none;cursor:crosshair;display:block}


/* barra laterale chiusa: icone nella barra in alto */
.tabpill{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:22px;height:44px;padding:0 4px}
.tabpill button{width:48px;height:36px;border-radius:18px;display:grid;place-items:center;position:relative}
.tabpill button:hover{background:var(--chip)}
.tabpill i{position:absolute;top:1px;right:5px;font-style:normal;font-size:10px;font-weight:700;background:var(--orange);color:#fff;border-radius:8px;padding:0 4px;line-height:15px}
.trow2 h1.red b{color:var(--red)}
/* mese a blocchi, come su iPad */
.mhead span.we{color:var(--muted)}
.mcell.we{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.mcell.void{cursor:default}
.mnum{font-weight:400}
.mev .bar{width:3px;height:12px;border-radius:2px;background:rgb(var(--c));flex:none}
.mev.all{background:var(--chip);color:var(--fg);font-weight:500}
.mev.all .ck{width:12px;height:12px;border-width:1.5px}
/* anno continuo */
.year{display:block;padding:0 4px 40px;position:relative}
.yblock{padding-bottom:10px}
.yh{font-size:56px;font-weight:700;letter-spacing:-.02em;margin:24px 0 18px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 40px}
.ym-t{font-size:20px;font-weight:700;color:var(--fg);margin-bottom:12px}
.ym-t.cur{color:var(--red)}
.ym-g{row-gap:4px}
.ym-g .w{font-size:11px;padding-bottom:6px}
.ym-g button{font-size:14px;height:28px;width:28px;justify-self:center;border-radius:14px}

/* barra laterale con sezioni a tendina */
.brand{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px 8px}
.brand-t{font-size:20px;font-weight:800;letter-spacing:-.01em}
.round.sm{width:38px;height:38px;border-radius:19px;background:var(--chip)}
.mini{padding:4px 4px 6px}
.mini-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;padding:0 4px 6px}
.mini-h span{display:flex;gap:2px}
.mini-h button{width:24px;height:24px;border-radius:6px;color:var(--muted)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}
.mini-g .w{font-size:10px;color:var(--muted);padding-bottom:2px}
.mini-g button{font-size:12px;height:26px;border-radius:13px;position:relative;font-variant-numeric:tabular-nums}
.mini-g button.oth{color:var(--muted);opacity:.55}
.mini-g button.in{background:var(--chip)}
.mini-g button.today{background:var(--red);color:#fff;font-weight:700}
.mini-g button.dot:after{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--muted)}
.sec{border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
.sec .sec-h{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 4px 6px;cursor:default}
.sec-t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--fg)}
.sec-t .cnt{font-size:12px;font-weight:700;color:var(--orange)}
.chev{display:inline-block;color:var(--muted);font-size:18px;line-height:1;transition:transform .15s;width:10px}
.chev.open{transform:rotate(90deg)}
.sec-add{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;color:var(--muted)}
.sec-add:hover{background:var(--chip);color:var(--fg)}
.sec-add svg.i{width:18px;height:18px}
.sec-b{padding:0 0 6px}
.side-tray{padding:2px 4px!important}

/* titolo e tendine */
.trow2 h1 .wd{font-size:17px;color:var(--muted);font-weight:400;letter-spacing:0}
.ddb{height:32px;padding:0 12px;border-radius:16px;background:var(--card);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;align-self:center}
.ddb span{font-weight:700;color:var(--muted)}
.ddb span.or{color:var(--orange)}
.ddb.on{background:var(--fg);color:var(--bg)}
.ddb.on span{color:inherit}
.trow2{align-items:center}
.trow2 h1{align-self:baseline}

/* griglia che scorre in modo continuo */
.gsc{overflow:auto;scroll-snap-type:x mandatory;scroll-padding-left:58px;overscroll-behavior-x:contain;touch-action:auto}
.gwrap{width:calc(58px + var(--nd) * var(--cw,120px));position:relative}
.gtop,.gbody{display:grid;grid-template-columns:58px repeat(var(--nd),var(--cw,120px))}
.gtop{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 0 6px}
.corner{position:sticky;left:0;z-index:7;background:var(--bg)}
.gbody .gut{position:sticky;left:0;z-index:5;background:var(--bg)}
.gtop .dh{scroll-snap-align:start;font-size:16px;gap:5px;position:relative}
.gtop .dh .unc{font-size:10.5px;font-weight:700;color:#fff;background:var(--blue);border-radius:9px;min-width:18px;height:18px;padding:0 5px;margin-left:2px}
.lift{transform:scale(1.04);box-shadow:var(--shadow);z-index:8}

/* paragrafi delle schede */
.para{position:relative;border-radius:12px;margin:2px -6px;padding:2px 6px}
.para.box{background:rgb(var(--bc,var(--pc))/.14);border:1px solid rgb(var(--bc,var(--pc))/.4);padding:10px 14px;margin:10px -6px}
.para.linked{box-shadow:inset 3px 0 0 rgb(var(--pc));padding-left:14px}
.para.flash{animation:flash 1.4s ease}
.pbadge{float:right;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin:4px 0 4px 10px;max-width:55%;user-select:none;-webkit-user-select:none}
.pbadge button{font-size:11.5px;background:var(--chip);border-radius:10px;padding:3px 9px;display:inline-flex;gap:5px;align-items:center;font-family:var(--sys);color:var(--fg)}
.pbadge .dot{width:7px;height:7px;border-radius:50%;background:rgb(var(--c))}
.pg-body>.para:first-child h2:first-child,.pg-body>.para:first-child h3:first-child{margin-top:4px}

/* collega a una scheda, compatto */
.linkrow{width:100%;text-align:left;cursor:pointer}
.linkrow .v{color:var(--muted);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#f-res .res.back{color:var(--blue);font-size:13.5px}

.gtop .dh{cursor:pointer;border-radius:10px}
.gtop .dh:hover{background:var(--card)}
.gtop .dh .unc{display:inline-grid;place-items:center}
.daypop{max-height:50%}

/* sezioni della barra laterale: freccia apre/chiude, nome apre la pagina */
.sec .sec-h{gap:2px;padding:8px 2px 4px 0}
.chevb{width:26px;height:30px;display:grid;place-items:center;border-radius:8px}
.sec-t{flex:1;text-align:left;padding:4px 6px;border-radius:8px}
.sec-t:hover,.sec-t.on{background:var(--chip)}
.sub-h{font-size:12px;color:var(--muted);font-weight:600;margin:8px 6px 4px;text-transform:uppercase;letter-spacing:.05em}
.qadd input{width:100%;box-sizing:border-box;border:0;background:var(--group);border-radius:10px;padding:9px 11px;font-size:14px;outline:none}
.qadd input:focus{box-shadow:0 0 0 2px var(--blue)}
.sec .qadd{padding:2px 4px 2px}
/* pagina Da fare */
.todo{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-content:start;padding:2px 2px 30px}
.tcol{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcol-h{display:flex;align-items:baseline;gap:8px}
.tcol-h b{font-size:20px}
.tcol-h span{color:var(--muted);font-size:13px}
.tcol-h .cnt{margin-left:auto;color:var(--orange);font-weight:700;font-size:15px}
.tlist{background:transparent!important;gap:5px!important;min-height:40px}
.tlist .chip{padding:9px 10px;font-size:14px;background:var(--group)}
.tlist .chip .ck{width:18px;height:18px}
.tlist.timed{display:flex;flex-direction:column}
.trow{display:flex;justify-content:flex-start;width:100%;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:13.5px;text-align:left}
.trow:hover{background:var(--group)}
.trow .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:40px}
.trow .bar{width:3px;height:16px;border-radius:2px;background:rgb(var(--c))}
.trow .tt{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ddb.big{height:40px;padding:0 18px;border-radius:20px;background:var(--blue);color:#fff;font-size:15px;font-weight:600}
.ddb.big span{background:#fff;color:var(--blue);border-radius:11px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px;font-size:13px}
.ddb.big.on{background:var(--fg);color:var(--bg)}
.ddb.big.on span{background:var(--bg);color:var(--fg)}

  switch(r.freq){
    case 'daily':return diff%(r.interval||1)===0;
    case 'weekdays':return b.getDay()>=1&&b.getDay()<=5;
    case 'weekly':return diff%(7*(r.interval||1))===0;
    case 'monthly':return b.getDate()===a.getDate();
    case 'yearly':return b.getDate()===a.getDate()&&b.getMonth()===a.getMonth();
  }return false;
}
function occOn(d){

}

}

/* ---------- griglia oraria continua ---------- */
function layout(list){
  list.sort((a,b)=>a.start-b.start||b.dur-a.dur);
  let cl=[],end=-1;
  const flush=()=>{const cols=[];cl.forEach(e=>{let i=cols.findIndex(c=>c<=e.start);if(i<0){i=cols.length;cols.push(0)}cols[i]=e.start+e.dur;e._c=i});cl.forEach(e=>e._n=cols.length);cl=[]};
  list.forEach(e=>{if(cl.length&&e.start>=end){flush();end=-1}cl.push(e);end=Math.max(end,e.start+e.dur)});
  flush();return list;
}
const GPAD=35;
function gridInfo(){
  if(V.resetScroll)V.keepDay=false;
  const n=UI.mode==='day'?1:UI.mode==='3'?3:7;
  const anchor=UI.mode==='week'&&!V.keepDay?weekDates(V.date)[0]:V.date;
  const days=[];for(let i=-GPAD;i<GPAD+n;i++)days.push(addDays(anchor,i));
  return {n,anchor,days};
}
function renderGrid(){
  const {n,days}=gridInfo(); V.gdays=days; V.gn=n;
  const heads=days.map(d=>{const dd=pd(d),we=dd.getDay()===0||dd.getDay()===6,c=occOn(d).filter(e=>e.start==null&&!e.done&&shown(e)).length;
    return `<div class="dh ${d===TODAY?'today':''} ${we?'we':''}" data-tray="${d}" data-act="daypop" data-date="${d}" title="Task del giorno"><span class="w">${WDS[dd.getDay()]}</span><b>${dd.getDate()}</b>${c?`<span class="unc">${c}</span>`:''}</div>`}).join('');
  let gut='';for(let h=H0+1;h<H1;h++)gut+=`<span style="top:${(h-H0)*PX}px">${pad(h)}:00</span>`;
  const cols=days.map(d=>{
    const list=layout(occOn(d).filter(e=>e.start!=null&&shown(e))), w=n===1?92:100;
    const evs=list.map(e=>{
      const top=(e.start-H0*60)/60*PX, h=Math.max(18,e.dur/60*PX-2), short=e.dur<45, l=linkOf(e), p=l&&pg(l.pageId);
      return `<div class="ev ${short?'short':''} ${e.done?'done':''} ${V.panel&&V.panel.id===e.id&&!e.title?'new':''} ${isSel(e)?'sel':''}" data-drag data-open="${e.id}"${e.occ?` data-occ="${e.occ}"`:''} style="--c:${C(e)};top:${top}px;height:${h}px;left:calc(${e._c/e._n*w}% + 2px);width:calc(${w/e._n}% - 4px)">
        <div class="t"><span class="ck ${e.done?'on':''}" data-ck="${e.id}"${e.occ?` data-occ="${e.occ}"`:''}></span><span class="tt">${esc(e.title||'Nuovo evento')}</span>${e.repeat?'<span class="rp" title="Si ripete">↻</span>':''}</div>
        ${n===1?`<span class="tm">${short?'':ICON.clock}${hm(e.start)}${short?'':' – '+hm(Math.min(e.start+e.dur,1440))}</span>`:''}
        ${n===1&&p&&!short&&h>58?`<span class="lk" data-lk="${p.id}" data-ev="${e.id}">${esc(p.emoji)} ${esc(p.title)}${l.text?' › '+esc(l.text):''}</span>`:''}<span class="rz" data-rz title="Trascina per cambiare la durata"></span></div>`;
    }).join('');
    return `<div class="col ${d===TODAY?'today':''}" data-date="${d}" style="height:${(H1-H0)*PX}px">${evs}${d===TODAY?`<div class="now" style="top:${nowTop()}px"></div>`:''}</div>`;
  }).join('');
  return `<div class="sc gsc" id="gscroll" style="--nd:${days.length}"><div class="gwrap">
    <div class="gtop"><div class="corner"></div>${heads}</div>
    <div class="gbody"><div class="gut" style="height:${(H1-H0)*PX}px">${gut}</div>${cols}</div></div></div>`;
}
function afterGrid(keepLeft){
  const sc=$('#gscroll');if(!sc)return;
  const n=V.gn, days=V.gdays, cw=Math.max(40,(sc.clientWidth-58)/n);
  sc.style.setProperty('--cw',cw+'px');
  sc.scrollLeft=GPAD*cw;const x0=sc.scrollLeft;
  if(V.drop==='day')renderDD();
  let raf=0,busy=false;
  sc.addEventListener('scroll',()=>{
    hideTip();if(V.drop==='day'&&Math.abs(sc.scrollLeft-x0)>6){V.drop=null;renderDD()}cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const i=Math.max(0,Math.min(days.length-1,Math.round(sc.scrollLeft/cw)));
      if(days[i]!==V.date){V.date=days[i];V.keepDay=true;V.mini=V.date;updateTitle()}
      if(!busy&&(i<4||i>days.length-n-4)){busy=true;clearTimeout(V.gt);V.gt=setTimeout(()=>{renderMain();renderSide()},250)}
      clearTimeout(V.st);V.st=setTimeout(()=>{if(!busy)renderSide()},300);
    });
  },{passive:true});
}
const nowTop=()=>{const d=new Date();return (d.getHours()*60+d.getMinutes()-H0*60)/60*PX};

/* ---------- mese e anno ---------- */
function renderMonth(){
  const d=pd(V.date);
  
  const mev=e=>e.start==null
    ?`<div class="mev all ${e.done?'done':''} ${isSel(e)?'sel':''}" data-drag data-open="${e.id}"${e.occ?` data-occ="${e.occ}"`:''} style="--c:${C(e)}"><span class="ck ${e.done?'on':''}" data-ck="${e.id}"${e.occ?` data-occ="${e.occ}"`:''}></span><span class="tt">${esc(e.title||'Senza titolo')}</span></div>`
    :`<div class="mev ${e.done?'done':''} ${isSel(e)?'sel':''}" data-drag data-open="${e.id}"${e.occ?` data-occ="${e.occ}"`:''} style="--c:${C(e)}"><span class="bar"></span><span class="tt">${esc(e.title||'Senza titolo')}</span></div>`;
  let out='';
  for(let k=-12;k<=12;k++){
    const first=new Date(d.getFullYear(),d.getMonth()+k,1), ym=ds(first).slice(0,7), mo=first.getMonth();
    let s=addDays(ds(first),-((first.getDay()+6)%7)), weeks='';
    for(;;){
      let cells='';
      for(let i=0;i<7;i++){
        const c=addDays(s,i),cd=pd(c),we=i>4;
        if(cd.getMonth()!==mo){cells+=`<div class="mcell void ${we?'we':''}"></div>`;continue}
        const list=occOn(c).filter(shown).sort((a,b)=>(a.start??-1)-(b.start??-1));
        cells+=`<div class="mcell ${c===TODAY?'today':''} ${we?'we':''}" data-day="${c}">
          <button class="mnum" data-act="goday" data-date="${c}">${cd.getDate()}</button>
          ${list.slice(0,5).map(mev).join('')}${list.length>5?`<button class="more" data-act="goday" data-date="${c}">+${list.length-5} altri</button>`:''}</div>`;
      }
      weeks+=`<div class="mweek">${cells}</div>`;
      s=addDays(s,7);
      if(pd(s).getMonth()!==mo)break;
    }
    out+=`<div class="mblock" data-ym="${ym}">${weeks}</div>`;
  }
  return `<div class="mwrap"><div class="mhead">${['lun','mar','mer','gio','ven','sab','dom'].map((x,i)=>`<span class="${i>4?'we':''}">${x}</span>`).join('')}</div>
    <div class="mscroll" id="mscroll">${out}</div></div>`;
}
function scrollToMonth(ym,smooth){
  const sc=$('#mscroll');if(!sc)return;
  const b=sc.querySelector(`.mblock[data-ym="${ym}"]`);
  if(!b){V.date=ym+'-01';V.resetScroll=true;renderMain();return}
  if(smooth)sc.scrollTo({top:b.offsetTop,behavior:'smooth'});else sc.scrollTop=b.offsetTop;
}
function afterMonth(keep){
  const sc=$('#mscroll');if(!sc)return;
  const wh=Math.max(92,Math.floor(sc.clientHeight/5));sc.style.setProperty('--wh',wh+'px');
  if(keep!=null)sc.scrollTop=keep*wh;else scrollToMonth(V.date.slice(0,7),false);
  const blocks=[...sc.querySelectorAll('.mblock')];let busy=false;
  sc.addEventListener('scroll',()=>{
    hideTip();
    const y=sc.scrollTop+wh*1.2;let cur=blocks[0];
    for(const b of blocks){if(b.offsetTop<=y)cur=b;else break}
    const ym=cur.dataset.ym;
    if(ym!==V.date.slice(0,7)){V.date=ym+'-01';const h=main.querySelector('.trow2 h1');const m=pd(V.date);if(h)h.innerHTML=`<b>${MO[m.getMonth()]}</b> ${m.getFullYear()}`}
    if(!busy&&(sc.scrollTop<wh*2||sc.scrollTop>sc.scrollHeight-sc.clientHeight-wh*2)){busy=true;setTimeout(()=>{V.resetScroll=true;renderMain()},120)}
  },{passive:true});
}
function renderYear(){
  const y0=pd(V.date).getFullYear(), ty=pd(TODAY).getFullYear(), tm=pd(TODAY).getMonth();
  let h='';
  for(let y=y0-4;y<=y0+4;y++){
    let months='';
    for(let m=0;m<12;m++){
      const first=new Date(y,m,1), off=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
      let g=['L','M','M','G','V','S','D'].map(x=>`<span class="w">${x}</span>`).join('')+'<span></span>'.repeat(off);
      for(let i=1;i<=days;i++){const c=ds(new Date(y,m,i));g+=`<button class="${c===TODAY?'today':''}" data-act="goday" data-date="${c}">${i}</button>`}
      months+=`<div class="ym"><button class="ym-t ${y===ty&&m===tm?'cur':''}" data-act="gomonth" data-date="${ds(first)}">${MO[m].slice(0,3).replace(/^./,x=>x.toUpperCase())}</button><div class="ym-g">${g}</div></div>`;
    }
    h+=`<section class="yblock" data-y="${y}"><h2 class="yh">${y}</h2><div class="ygrid">${months}</div></section>`;
  }
  return `<div class="year" id="yscroll">${h}</div>`;
}
function scrollToYear(y,smooth){
  const sc=$('#yscroll');if(!sc)return;const b=sc.querySelector(`.yblock[data-y="${y}"]`);
  if(!b){V.date=y+'-01-01';V.resetScroll=true;renderMain();return}
  const top=b.offsetTop+b.querySelector('.yh').offsetHeight;
  if(smooth)sc.scrollTo({top,behavior:'smooth'});else sc.scrollTop=top;
}
function afterYear(){
  const sc=$('#yscroll');if(!sc)return;
  scrollToYear(pd(V.date).getFullYear(),false);
  const blocks=[...sc.querySelectorAll('.yblock')];let busy=false;
  sc.addEventListener('scroll',()=>{
    const y=sc.scrollTop+sc.clientHeight*.3;let cur=blocks[0];
    for(const b of blocks){if(b.offsetTop<=y)cur=b;else break}
    const yr=+cur.dataset.y;
    if(yr!==pd(V.date).getFullYear()){V.date=yr+'-01-01';const h=main.querySelector('.trow2 h1');if(h)h.innerHTML=`<b>${yr}</b>`}
    if(!busy&&(sc.scrollTop<200||sc.scrollTop>sc.scrollHeight-sc.clientHeight-200)){busy=true;setTimeout(()=>{V.resetScroll=true;renderMain()},150)}
  },{passive:true});
}

function aiPrompt(txt){
  const now=new Date(), days=[];
  for(let i=0;i<14;i++){const d=addDays(TODAY,i);days.push(WD[pd(d).getDay()]+' '+pd(d).getDate()+' '+MO[pd(d).getMonth()]+' = '+d)}
  const ctx=[];
  for(let i=-3;i<=21;i++){const d=addDays(TODAY,i);occOn(d).forEach(e=>ctx.push(`${e.id}|${d}|${e.start!=null?hm(e.start)+'-'+hm(Math.min(e.start+e.dur,1440)):'senza orario'}|${e.title}|${calOf(e).name}${e.repeat?'|si ripete':''}${e.done?'|fatto':''}`))}
  const inbox=inboxList().map(e=>`${e.id}|${e.title}${e.date?'|era per '+e.date:''}`);
  return `Sei l'assistente di un'app calendario italiana. Leggi la richiesta dell'utente e decidi cosa fare.
Oggi è ${WD[now.getDay()]} ${TODAY}, ore ${hm(now.getHours()*60+now.getMinutes())}.
Prossimi giorni: ${days.join('; ')}.
Calendari (id: nome): ${S.calendars.map(c=>c.id+': '+c.name).join('; ')}.
Schede (id: titolo): ${S.pages.map(p=>p.id+': '+p.title).join('; ')||'nessuna'}.
Eventi e task in calendario (id|giorno|orario|titolo|calendario): ${ctx.slice(0,150).join(' ; ')||'nessuno'}.
Task da sistemare (id|titolo): ${inbox.join(' ; ')||'nessuna'}.

Azioni possibili:
- "event": crea un evento o una task. Con giorno e ora: date e start. Con giorno senza ora: start null. Senza giorno: date null (va in Task da sistemare).
- "update": modifica un evento o task esistente (sposta, rinomina, cambia durata o calendario, segna fatto). Usa l'id esatto dall'elenco. Metti solo i campi da cambiare.
- "delete": elimina un evento o task esistente, solo se l'utente lo chiede chiaramente.
- "page": crea una scheda con righe di contenuto. "append": aggiunge righe a una scheda esistente.
- "calendar": crea un calendario (pageTitle = scheda da collegare, esistente o nuova, oppure null).
- "answer": se l'utente fa una domanda sui suoi impegni (per esempio "cosa ho domani?"), rispondi in una o due frasi brevi in italiano, usando solo i dati sopra.
- "unclear": se la richiesta non riguarda il calendario, le task o le schede, o non sai cosa fare, usa solo questa.
Scegli il calendario più adatto (calendarId). Titoli brevi in italiano con la maiuscola. Durata predefinita 60 minuti. Una frase può contenere più azioni. Ripetizioni: "repeat" può essere daily, weekdays, weekly, weekly2, monthly, yearly oppure null.

Rispondi solo con JSON in questa forma:
{"actions":[
 {"type":"event","title":"Palestra","date":"YYYY-MM-DD o null","start":"HH:MM o null","durationMin":60,"calendarId":"id o null","pageId":"id o null","repeat":null},
 {"type":"update","id":"id","title":"...","date":"YYYY-MM-DD o null","start":"HH:MM o null","durationMin":60,"calendarId":"id","done":true},
 {"type":"delete","id":"id"},
 {"type":"page","title":"Ricette","emoji":"🍝","lines":["Pasta al forno"]},
 {"type":"append","pageId":"id","lines":["..."]},
 {"type":"calendar","name":"Studio","color":"red|orange|yellow|green|teal|blue|purple|pink|brown","pageTitle":null},
 {"type":"answer","text":"..."},
 {"type":"unclear"}
]}

L'utente ha detto: «${txt}»`;
}
function applyActions(actions){
  const U={events:[],pages:[],cals:[],html:{},prev:[],removed:[]}, out=[];
  const okD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
  const toMin=s=>{const m=typeof s==='string'&&s.match(/^(\d{1,2}):(\d{2})$/);return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null};
  const listHTML=ls=>{ls=(Array.isArray(ls)?ls:[]).map(x=>String(x).trim()).filter(Boolean);return newPara(ls.length>1?'<ul>'+ls.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':ls.length?'<p>'+esc(ls[0])+'</p>':'<p><br></p>')};
  const findPageByTitle=t=>S.pages.find(p=>p.title.trim().toLowerCase()===String(t||'').trim().toLowerCase());
  const calFrom=v=>calById(v)||S.calendars.find(c=>c.name.toLowerCase()===String(v||'').toLowerCase());
  const rep=v=>REPN[v]?{freq:v==='weekly2'?'weekly':v,interval:v==='weekly2'?2:1,until:null}:null;
  let answer='',unclear=false;
  actions.filter(a=>a&&a.type==='page').forEach(a=>{
    const p={id:'p'+uid(),emoji:String(a.emoji||'📝').slice(0,4),title:String(a.title||'Nuova scheda').slice(0,80),font:'Sistema',color:'yellow',html:listHTML(a.lines)};
    S.pages.push(p);U.pages.push(p.id);out.push('scheda '+p.title);
  });
  actions.filter(a=>a&&a.type==='calendar').forEach(a=>{
    let page=a.pageTitle?findPageByTitle(a.pageTitle):null;
    if(a.pageTitle&&!page){page={id:'p'+uid(),emoji:'📝',title:String(a.pageTitle).slice(0,80),font:'Sistema',color:'yellow',html:newPara()};S.pages.push(page);U.pages.push(page.id)}
    const c={id:'c'+uid(),name:String(a.name||'Nuovo calendario').slice(0,40),color:PAL[a.color]?a.color:'teal',pageId:page?page.id:null,visible:true};
    S.calendars.push(c);U.cals.push(c.id);out.push('calendario '+c.name);
  });
  actions.forEach(a=>{
    if(!a)return;
    if(a.type==='answer'&&a.text)answer=String(a.text).slice(0,600);
    if(a.type==='unclear')unclear=true;
    if(a.type==='append'&&pg(a.pageId)){const p=pg(a.pageId);if(!(p.id in U.html))U.html[p.id]=p.html;p.html+=listHTML(a.lines);out.push('righe in '+p.title)}
    if(a.type==='event'&&a.title){
      const date=okD(a.date)?a.date:null, start=date?toMin(a.start):null, cal=calFrom(a.calendarId);
      const e=newEvent({title:String(a.title).slice(0,120),date,start,dur:Math.max(15,Math.min(+a.durationMin||60,600)),cal:(cal||calById(defCal())).id,link:pg(a.pageId)?{pageId:a.pageId,blocks:[],text:null}:null,repeat:date?rep(a.repeat):null});
      U.events.push(e.id);out.push(e.title+(date?' ('+when(e)+')':' (da sistemare)'));
    }
    if(a.type==='update'&&ev(a.id)){
      const e=ev(a.id);U.prev.push(JSON.parse(JSON.stringify(e)));
      if(a.title)e.title=String(a.title).slice(0,120);
      if('date' in a&&(a.date===null||okD(a.date))){e.date=a.date;if(!e.date)e.start=null}
      if('start' in a&&e.date){e.start=a.start===null?null:(toMin(a.start)??e.start)}
      if(a.durationMin)e.dur=Math.max(15,Math.min(+a.durationMin,600));
      if(a.calendarId&&calFrom(a.calendarId))e.cal=calFrom(a.calendarId).id;
      if(typeof a.done==='boolean')e.done=a.done;
      out.push(e.title+' aggiornato');
    }
    if(a.type==='delete'&&ev(a.id)){const e=ev(a.id);U.removed.push(JSON.parse(JSON.stringify(e)));S.events=S.events.filter(x=>x!==e);out.push(e.title+' eliminato')}
  });
  save();return {U,out,answer,unclear};
}
async function runVoice(){
  const t=$('#v-text'), txt=(t?.value||'').trim(); if(!txt||VS.busy) return;
  if(DICT)DICT.stop().catch(()=>{});
  VS={busy:true,answer:'',unclear:false,err:'',text:txt};renderVoice();
  let actions=null;
  if(SAMPLE){
    try{const r=await SAMPLE.json(aiPrompt(txt),{cache:false});actions=r&&Array.isArray(r.actions)?r.actions:null}
    catch(e){if(e&&e.code==='not_granted')SAMPLE=null;
      if(e&&e.code!=='not_granted'&&e.code!=='unavailable'){VS={busy:false,answer:'',unclear:true,err:'Claude non ha risposto. Riprova, oppure apri la richiesta in Claude.',text:txt};renderVoice();return}}
  }
  if(!actions){const q=parseQuick(txt);actions=[{type:'event',title:q.title,date:q.date,start:q.start!=null?hm(q.start):null}]}
  const {U,out,answer,unclear}=applyActions(actions);
  render();
  if(out.length&&!answer&&!unclear){
    closeVoice();
    toastAction('Fatto: '+out.join(', '),'Annulla',()=>undoVoice(U));
    return;
  }
  if(out.length)toastAction('Fatto: '+out.join(', '),'Annulla',()=>undoVoice(U));
  VS={busy:false,answer,unclear:unclear||(!answer&&!out.length),err:'',text:txt};renderVoice();
}
function undoVoice(U){
  if(!U)return;
  S.events=S.events.filter(e=>!U.events.includes(e.id));
  S.pages=S.pages.filter(p=>!U.pages.includes(p.id));
  S.calendars=S.calendars.filter(c=>!U.cals.includes(c.id));
  Object.entries(U.html).forEach(([id,h])=>{const p=pg(id);if(p)p.html=h});
  U.prev.forEach(o=>{const i=S.events.findIndex(e=>e.id===o.id);if(i>=0)S.events[i]=o});
  U.removed.forEach(o=>S.events.push(o));
  save();render();toast('Annullato');
}

const draw=$('#draw');let DR=null;
const INKS=['#1c1c1e','#ff3b30','#ff9500','#34c759','#007aff','#af52de'];
const DW=2000,DH=1300;
function openDraw(body,img){
  DR={body,img,strokes:[],cur:null,color:INKS[0],size:4,erase:false,pen:false,bg:null};
  draw.hidden=false;renderDrawTools();
  const cv=$('#dcv');cv.width=DW;cv.height=DH;DR.ctx=cv.getContext('2d');
  if(img){const b=new Image();b.crossOrigin='anonymous';b.onload=()=>{DR.bg=b;redraw()};b.src=img.src}
  redraw();
}
function renderDrawTools(){
  const keep=$('#dcv');
  const tools=`<button data-act="dcancel">Annulla</button><span class="dsep"></span>
    ${INKS.map(c=>`<button class="ink ${!DR.erase&&c===DR.color?'on':''}" data-act="dink" data-c="${c}" style="background:${c}" aria-label="Colore"></button>`).join('')}
    <span class="dsep"></span>${[2,4,8].map(s=>`<button class="dsz ${s===DR.size?'on':''}" data-act="dsize" data-s="${s}" aria-label="Spessore ${s}"><i style="width:${s+3}px;height:${s+3}px"></i></button>`).join('')}
    <button class="${DR.erase?'on':''}" data-act="derase">Gomma</button><button data-act="dundo" aria-label="Annulla tratto">↶</button>
    <span class="sp"></span><button class="pri" data-act="dsave">Fine</button>`;
  if(keep){draw.querySelector('.dtools').innerHTML=tools;return}
  draw.innerHTML=`<div class="dbox"><div class="dtools">${tools}</div><canvas id="dcv"></canvas><span class="note">Disegna con l'Apple Pencil o con il dito. Se usi la Pencil, il palmo appoggiato viene ignorato.</span></div>`;
  const cv=$('#dcv');
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*DW,(e.clientY-r.top)/r.height*DH,e.pressure||.5]};
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen')DR.pen=true;if(DR.pen&&e.pointerType==='touch')return;
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    DR.cur={color:DR.erase?'#ffffff':DR.color,size:DR.erase?DR.size*4:DR.size,pts:[pt(e)]};DR.strokes.push(DR.cur);
  });
  cv.addEventListener('pointermove',e=>{
    if(!DR||!DR.cur)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(x=>{DR.cur.pts.push(pt(x));seg(DR.cur,DR.cur.pts.length-1)});
  });
  const end=()=>{if(DR)DR.cur=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function seg(s,i){
  if(i<1)return;const c=DR.ctx,a=s.pts[i-1],b=s.pts[i];
  c.strokeStyle=s.color;c.lineCap='round';c.lineJoin='round';c.lineWidth=s.size*2*(.45+b[2]);
  c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
}
function redraw(){
  const c=DR.ctx;c.fillStyle='#ffffff';c.fillRect(0,0,DW,DH);
  if(DR.bg)try{c.drawImage(DR.bg,0,0,DW,DH)}catch(e){}
  DR.strokes.forEach(s=>{if(s.pts.length===1){const p=s.pts[0];c.fillStyle=s.color;c.beginPath();c.arc(p[0],p[1],s.size,0,7);c.fill()}for(let i=1;i<s.pts.length;i++)seg(s,i)});
}
function closeDraw(){draw.hidden=true;draw.innerHTML='';DR=null}
async function saveDraw(){
  if(!DR)return;
  if(!DR.strokes.length&&!DR.img){closeDraw();return}
  const out=document.createElement('canvas');out.width=1000;out.height=650;out.getContext('2d').drawImage($('#dcv'),0,0,1000,650);
  let src;try{src=await canvasToSrc(out,'image/png')}catch(e){toast('Non riesco a salvare il disegno');return}
  const {body,img}=DR;closeDraw();
  if(img){img.src=src;savePageBody(body)}else insertAtSaved(body,`<img class="drawing" src="${esc(src)}" alt="Disegno">`);
  toast('Disegno salvato');
}

/* ---------- inserimento rapido ---------- */
function parseQuick(s){
  let t=' '+s+' ',date=null,start=null;
  for(const [w,n] of [['dopodomani',2],['domani',1],['oggi',0],['stasera',0]]){
    const re=new RegExp('\\s'+w+'(?=[\\s,.])','i');
    if(re.test(t)){date=addDays(TODAY,n);t=t.replace(re,' ');if(w==='stasera')start=1200;break}
  }
  if(!date){[['domenica'],['lunedì','lunedi'],['martedì','martedi'],['mercoledì','mercoledi'],['giovedì','giovedi'],['venerdì','venerdi'],['sabato']].forEach((vs,i)=>{
    if(date)return;const re=new RegExp('\\s(?:'+vs.join('|')+')(?=[\\s,.])','i');
    if(re.test(t)){date=addDays(TODAY,(i-pd(TODAY).getDay()+7)%7);t=t.replace(re,' ')}})}
  const m=t.match(/\s(?:alle ore|alle|ore|h)\s*(\d{1,2})(?:[:.](\d{2}))?(?=[\s,.])/i);
  if(m&&+m[1]<24&&+(m[2]||0)<60){start=+m[1]*60+ +(m[2]||0);t=t.replace(m[0],' ')}
  if(start!=null&&!date)date=TODAY;
  t=t.replace(/\s(per|il|di|a)\s*$/i,' ').replace(/\s+/g,' ').trim();
  return {title:t.charAt(0).toUpperCase()+t.slice(1),date,start};
}

    case 'f-title': x.title=t.value;break;
    case 'f-cal': x.cal=t.value;UI.lastCal=t.value;saveUI();save();renderSide();renderMain();renderPanel();return;
    case 'f-date': x.from=null;x.date=t.value||null;if(!x.date)x.start=null;save();renderSide();renderMain();renderPanel();return;
    case 'f-timed': x.start=t.checked?(x.start??540):null;panel.querySelectorAll('.tf').forEach(r=>r.hidden=!t.checked);break;
    case 'f-start': if(t.value){const[h,m]=t.value.split(':').map(Number);x.start=Math.min(h*60+m,H1*60-15)}break;
    case 'f-dur': x.dur=+t.value;break;
    case 'f-done': setDone(x,V.panel.occ,t.checked);break;
    case 'f-list': x.list=t.value||null;save();renderSide();renderMain();return;
    case 'f-rep': {const v=t.value;x.repeat=v?{freq:v==='weekly2'?'weekly':v,interval:v==='weekly2'?2:1,until:(x.repeat&&x.repeat.until)||null}:null;if(!v){x.skip=[];x.doneDates=[]}save();renderSide();renderMain();renderPanel();return}
    case 'f-until': if(x.repeat)x.repeat.until=t.value||null;save();renderSide();renderMain();renderPanel();return;
    case 'f-note': x.note=t.value;save();return;
    case 'f-q': renderLinkResults();return;
    default: return;
  }
  save();renderSide();renderMain();
});
document.addEventListener('selectionchange',()=>{
  const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);
  const n=r.commonAncestorContainer, el=(n.nodeType===1?n:n.parentElement), body=el&&el.closest&&el.closest('.pg-body');
  if(!body)return; savedRange=r.cloneRange();
  const txt=s.toString().trim(); if(txt) lastSel={pageId:body.dataset.pid,text:txt.split('\n')[0].trim()};
});

/* trascinamento (dito, Apple Pencil o mouse) e scorrimento laterale per cambiare periodo */
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const el=e.target.closest('[data-drag]');
  if(!el){
    if(e.pointerType!=='mouse'&&e.target.closest('.swipe'))SW={x0:e.clientX,y0:e.clientY,id:e.pointerId};
    return;
  }
  if(e.target.closest('[data-ck],[data-lk],[data-act],[data-rz],input,button,select,label'))return;
  const r=el.getBoundingClientRect(), isEv=el.classList.contains('ev');
  D={id:el.dataset.open,occ:el.dataset.occ,el,x0:e.clientX,y0:e.clientY,offX:Math.min(e.clientX-r.left,isEv?50:30),offY:isEv?Math.min(e.clientY-r.top,14):10,w:r.width,h:r.height,isEv,started:false,target:null};
  if(e.pointerType==='touch'){D.touch=true;const me=D;D.timer=setTimeout(()=>{if(D===me){D.armed=true;el.classList.add('lift')}},300)}
});
document.addEventListener('pointermove',e=>{
  if(!D)return;
  if(!D.started){const dist=Math.hypot(e.clientX-D.x0,e.clientY-D.y0);if(D.touch&&!D.armed){const dx=e.clientX-D.x0,dy=e.clientY-D.y0;if(D.swipe||(D.el.classList.contains('chip')&&dx<-10&&Math.abs(dx)>Math.abs(dy)*1.3)){clearTimeout(D.timer);D.swipe=true;D.dx=Math.min(0,dx);D.el.style.transform='translateX('+D.dx+'px)';D.el.classList.add('swiping');D.el.classList.toggle('kill',D.dx<-90);e.preventDefault();return}if(dist>8){clearTimeout(D.timer);D=null}return}if(!D.armed&&dist<6)return;startDrag()}
  e.preventDefault();moveDrag(e.clientX,e.clientY);
},{passive:false});
document.addEventListener('touchmove',e=>{if(R||(D&&(D.started||D.armed||D.swipe)))e.preventDefault()},{passive:false});
document.addEventListener('pointerup',e=>{
  if(SW&&SW.id===e.pointerId){const dx=e.clientX-SW.x0,dy=e.clientY-SW.y0;SW=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){justDragged=true;setTimeout(()=>justDragged=false,80);step(dx<0?1:-1)}}
  if(D&&D.swipe){const el=D.el,dx=D.dx||0,id=D.id,oc=D.occ;clearTimeout(D.timer);D=null;justDragged=true;setTimeout(()=>justDragged=false,80);
    if(dx<-90){const x=ev(id);if(x){if(x.repeat&&oc)x.skip=[...(x.skip||[]),oc];else S.events=S.events.filter(z=>z!==x);save();render();toastAction('Eliminata: '+(x.title||'task'),'Annulla',undoLast)}}else{el.style.transform='';el.classList.remove('swiping','kill')}return}
  if(!D)return;if(D.started){drop();justDragged=true;setTimeout(()=>justDragged=false,60)}cleanup()});
document.addEventListener('pointercancel',()=>{SW=null;if(D)cleanup()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});
let wheelX=0,wheelLock=0;
document.addEventListener('wheel',e=>{
  if(V.view!=='cal'||!e.target.closest('.swipe')||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();if(Date.now()<wheelLock)return;wheelX+=e.deltaX;
  if(Math.abs(wheelX)>90){step(wheelX>0?1:-1);wheelX=0;wheelLock=Date.now()+450}
},{passive:false});
function startDrag(){
  D.started=true;
  const g=D.el.cloneNode(true);g.classList.add('ghost-drag');g.classList.remove('short');
  g.style.width=Math.min(Math.max(D.w,140),240)+'px';g.style.height=D.isEv?Math.min(Math.max(D.h,30),90)+'px':'';
  document.body.appendChild(g);D.g=g;D.el.classList.add('dragging');document.body.classList.add('is-dragging');
  const dd=main.querySelector('.dd'); if(dd&&dd.contains(D.el)){dd.hidden=true;V.drop=null}
}
function clearOver(){document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));document.querySelectorAll('.prev').forEach(x=>x.remove())}
function moveDrag(x,y){
  D.g.style.left=(x-D.offX)+'px';D.g.style.top=(y-D.offY)+'px';
  const t=document.elementFromPoint(x,y);clearOver();D.target=null;if(!t)return;
  const col=t.closest('.col'),day=t.closest('[data-day]'),tray=t.closest('[data-tray]'),cd=t.closest('[data-caldrop]');
  if(col){
    const r=col.getBoundingClientRect(),x0=ev(D.id),dur=x0.start!=null?x0.dur:60;
    let m=H0*60+Math.round((y-D.offY-r.top)/PX*4)*15;m=Math.max(H0*60,Math.min(m,H1*60-15));
    const p=document.createElement('div');p.className='prev';p.style.top=(m-H0*60)/60*PX+'px';p.style.height=Math.max(18,dur/60*PX-2)+'px';
    p.textContent=hm(m)+' – '+hm(Math.min(m+dur,1440));col.appendChild(p);D.target={type:'col',date:col.dataset.date,m};
  }else if(day){day.classList.add('over');D.target={type:'day',date:day.dataset.day}}
  else if(cd){cd.classList.add('over');D.target={type:'cal',id:cd.dataset.caldrop}}
  else if(t.closest('[data-listdrop]')){const ld=t.closest('[data-listdrop]');ld.classList.add('over');D.target={type:'list',id:ld.dataset.listdrop}}
  else if(tray){tray.classList.add('over');D.target={type:'tray',date:tray.dataset.tray}}
  const sc=main.querySelector('.sc');
  if(sc&&sc.id==='gscroll'){const rr=sc.getBoundingClientRect();if(x>rr.right-40)sc.scrollLeft+=10;else if(x<rr.left+58+30&&x>rr.left)sc.scrollLeft-=10}
  if(sc){const rr=sc.getBoundingClientRect();if(x>rr.left&&x<rr.right){if(y>rr.bottom-40)sc.scrollTop+=12;else if(y<rr.top+30&&y>rr.top-20)sc.scrollTop-=12}}
}
function drop(){
  const t=D.target;let x=ev(D.id);if(!t||!x)return;
  if(x.repeat&&D.occ&&t.type!=='cal'&&t.type!=='list')x=detach(x,D.occ);
  if(t.type==='col'){x.from=null;x.date=t.date;x.start=t.m;x.dur=x.dur||60;toast((x.title||'Evento')+' · '+when(x))}
  else if(t.type==='day'){x.from=null;x.date=t.date;toast((x.title||'Evento')+' · '+when(x))}
  else if(t.type==='cal'){x.cal=t.id;toast((x.title||'Evento')+' → '+calById(t.id).name)}
  else if(t.type==='list'){x.list=t.id;toast((x.title||'Task')+' → '+listById(t.id).name)}
  else{x.from=null;x.date=t.date||null;x.start=null;toast(x.date?'Senza orario · '+when(x):'Spostata in Task da sistemare')}
  save();renderSide();renderMain();if(V.panel&&V.panel.id===x.id)renderPanel();
}
let R=null;
document.addEventListener('pointerdown',e=>{
  const rz=e.target.closest('[data-rz]');if(!rz||e.button>0)return;
  const el=rz.closest('.ev'),x=ev(el.dataset.open);if(!x)return;
  e.preventDefault();hideTip();
  R={id:x.id,occ:el.dataset.occ,el,y0:e.clientY,dur0:x.dur,start:x.start,dur:x.dur,lbl:el.querySelector('.tm')};
  el.classList.add('resizing');document.body.classList.add('is-resizing');
},true);
document.addEventListener('pointermove',e=>{
  if(!R)return;e.preventDefault();
  const dur=Math.max(15,Math.min(1440-R.start,Math.round((R.dur0+(e.clientY-R.y0)/PX*60)/15)*15));
  if(dur===R.dur)return;R.dur=dur;R.el.style.height=Math.max(18,dur/60*PX-2)+'px';
  R.el.dataset.rzl=hm(R.start)+' – '+hm(R.start+dur);
},{passive:false});
document.addEventListener('pointerup',()=>{
  if(!R)return;const r=R;R=null;document.body.classList.remove('is-resizing');r.el.classList.remove('resizing');
  justDragged=true;setTimeout(()=>justDragged=false,80);
  if(r.dur===r.dur0)return;
  let x=ev(r.id);if(x.repeat&&r.occ)x=detach(x,r.occ);
  x.dur=r.dur;save();renderMain();if(V.panel&&V.panel.id===x.id)renderPanel();
  toast((x.title||'Evento')+' · '+hm(x.start)+' – '+hm(x.start+x.dur)+' ('+durLabel(x.dur)+')');
});
document.addEventListener('pointercancel',()=>{if(R){R.el.classList.remove('resizing');R=null;document.body.classList.remove('is-resizing');renderMain()}});
function cleanup(){clearTimeout(D.timer);if(D.g)D.g.remove();if(D.el)D.el.classList.remove('dragging','lift');clearOver();document.body.classList.remove('is-dragging');D=null}

document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('backl'))V.openLinks=e.target.open},true);
setInterval(()=>document.querySelectorAll('.now').forEach(n=>n.style.top=nowTop()+'px'),60000);
render();
})();
</script>
